<style>
:root{
  --bg:#09090b;--bg2:#0f0f12;--panel:#141418;--panel2:#1b1b21;--line:#27272f;--line2:#33333d;
  --tx:#f4f4f5;--tx2:#a1a1aa;--tx3:#71717a;--ac:#6366f1;--ac2:#a855f7;--ac-soft:rgba(99,102,241,.14);
  --ok:#22c55e;--ok-soft:rgba(34,197,94,.14);--warn:#f59e0b;--warn-soft:rgba(245,158,11,.14);--bad:#ef4444;--bad-soft:rgba(239,68,68,.14);
  --info:#06b6d4;--r:14px;--r2:10px;--sh:0 10px 30px rgba(0,0,0,.35);--side:250px;--top:60px;--bnav:64px;
  --sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px);
  color-scheme:dark;
}
:root[data-theme="light"]{
  --bg:#f6f6f8;--bg2:#ffffff;--panel:#ffffff;--panel2:#f2f2f6;--line:#e4e4ea;--line2:#d4d4dc;
  --tx:#18181b;--tx2:#52525b;--tx3:#8a8a94;--ac-soft:rgba(99,102,241,.10);--sh:0 10px 30px rgba(20,20,40,.08);color-scheme:light;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--tx);font:14px/1.5 Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased;overflow-x:hidden}
a{color:var(--ac);text-decoration:none}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3,h4{margin:0;line-height:1.25;font-weight:700;letter-spacing:-.01em}
h1{font-size:22px}h2{font-size:18px}h3{font-size:15px}
.mono{font-family:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px}
.muted{color:var(--tx2)}.dim{color:var(--tx3)}.small{font-size:12px}.xs{font-size:11px}
.row{display:flex;gap:10px;align-items:center}.wrap{flex-wrap:wrap}.col{display:flex;flex-direction:column;gap:10px}
.between{justify-content:space-between}.grow{flex:1;min-width:0}.right{margin-left:auto}.center{text-align:center}
.hide{display:none!important}.ellip{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gap4{gap:4px}.gap6{gap:6px}.gap16{gap:16px}.mt8{margin-top:8px}.mt12{margin-top:12px}.mt16{margin-top:16px}.mb8{margin-bottom:8px}.mb12{margin-bottom:12px}

/* ---------- Shell ---------- */
#app{min-height:100%}
.shell{display:grid;grid-template-columns:var(--side) 1fr;min-height:100vh;min-height:100dvh}
.side{position:sticky;top:0;height:100vh;height:100dvh;overflow-y:auto;background:var(--bg2);border-right:1px solid var(--line);padding:14px 10px calc(14px + var(--sab));display:flex;flex-direction:column;gap:2px;scrollbar-width:thin}
.brand{display:flex;align-items:center;gap:10px;padding:6px 10px 14px}
.logo{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,var(--ac),var(--ac2));display:grid;place-items:center;color:#fff;box-shadow:0 6px 18px rgba(99,102,241,.35);flex:none}
.brand b{font-size:15px;letter-spacing:-.01em}.brand small{display:block;color:var(--tx3);font-size:11px}
.nav-sec{font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--tx3);padding:12px 12px 4px}
.nav a{display:flex;align-items:center;gap:10px;padding:8px 12px;border-radius:9px;color:var(--tx2);font-weight:500;position:relative}
.nav a:hover{background:var(--panel2);color:var(--tx)}
.nav a.on{background:var(--ac-soft);color:var(--tx)}
.nav a.on::before{content:"";position:absolute;left:-10px;top:8px;bottom:8px;width:3px;border-radius:3px;background:var(--ac)}
.nav a .lock{margin-left:auto;opacity:.6}
.nav a .cnt{margin-left:auto;background:var(--ac);color:#fff;border-radius:99px;font-size:10px;padding:1px 7px;font-weight:700}
.main{min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:0;z-index:30;height:calc(var(--top) + var(--sat));padding:var(--sat) 18px 0;display:flex;align-items:center;gap:10px;background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.top .title{font-weight:700;font-size:16px}
.content{padding:20px;max-width:1400px;width:100%;margin:0 auto;flex:1}
.bnav{display:none}
.drawer-bg{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:60;opacity:0;pointer-events:none;transition:.2s}
.drawer-bg.on{opacity:1;pointer-events:auto}

@media (max-width:1023px){
  .shell{grid-template-columns:1fr}
  .side{position:fixed;left:0;top:0;bottom:0;width:min(84vw,300px);z-index:70;transform:translateX(-102%);transition:transform .22s ease;box-shadow:var(--sh);padding-top:calc(14px + var(--sat))}
  .side.on{transform:none}
  .top{padding:var(--sat) 12px 0}
  .content{padding:14px 12px calc(var(--bnav) + 18px + var(--sab))}
  .bnav{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;left:0;right:0;bottom:0;z-index:40;height:calc(var(--bnav) + var(--sab));padding-bottom:var(--sab);background:color-mix(in srgb,var(--bg2) 92%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line)}
  .bnav a{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--tx3);font-size:10.5px;font-weight:600;position:relative}
  .bnav a.on{color:var(--ac)}
  .bnav a .dot{position:absolute;top:8px;right:calc(50% - 16px);width:8px;height:8px;border-radius:50%;background:var(--bad)}
  .desk-only{display:none!important}
}
@media (min-width:1024px){.mob-only{display:none!important}}

/* ---------- Komponen ---------- */
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px;min-width:0}
.card.pad0{padding:0}.card.flat{background:var(--panel2)}
.card-h{display:flex;align-items:center;gap:10px;margin-bottom:12px}.card-h h3{flex:1}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g6{grid-template-columns:repeat(6,minmax(0,1fr))}.gauto{grid-template-columns:repeat(auto-fill,minmax(280px,1fr))}
.split{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:14px;align-items:start}
@media (max-width:1180px){.g6{grid-template-columns:repeat(3,minmax(0,1fr))}.split{grid-template-columns:1fr}}
@media (max-width:860px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:1fr}.g2{grid-template-columns:1fr}}
@media (max-width:520px){.g6{grid-template-columns:repeat(2,minmax(0,1fr))}.gauto{grid-template-columns:1fr}}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:38px;padding:0 14px;border-radius:10px;border:1px solid var(--line2);background:var(--panel2);color:var(--tx);font-weight:600;cursor:pointer;white-space:nowrap;transition:transform .05s,background .15s,border-color .15s;user-select:none}
.btn:hover{border-color:var(--tx3)}.btn:active{transform:scale(.98)}
.btn.pri{background:linear-gradient(135deg,var(--ac),#7c3aed);border-color:transparent;color:#fff;box-shadow:0 6px 16px rgba(99,102,241,.28)}
.btn.ok{background:var(--ok);border-color:transparent;color:#05250f}.btn.bad{background:var(--bad-soft);border-color:transparent;color:var(--bad)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--tx2)}.btn.ghost:hover{background:var(--panel2);color:var(--tx)}
.btn.sm{min-height:30px;padding:0 10px;font-size:12.5px;border-radius:8px}.btn.icon{width:38px;padding:0}.btn.sm.icon{width:30px}
.btn[disabled]{opacity:.5;pointer-events:none}
.btn .spin{width:14px;height:14px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:sp .7s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}

label.f{display:flex;flex-direction:column;gap:6px;font-size:12.5px;color:var(--tx2);font-weight:600;min-width:0}
.inp,select.inp,textarea.inp{width:100%;min-height:40px;padding:9px 12px;border-radius:10px;border:1px solid var(--line2);background:var(--bg2);color:var(--tx);outline:none;font-weight:400;font-size:14px}
textarea.inp{min-height:90px;resize:vertical;line-height:1.5}
.inp:focus{border-color:var(--ac);box-shadow:0 0 0 3px var(--ac-soft)}
input[type=range]{width:100%;accent-color:var(--ac)}input[type=checkbox],input[type=radio]{accent-color:var(--ac);width:16px;height:16px}
input[type=color]{width:44px;height:38px;border:1px solid var(--line2);border-radius:10px;background:none;padding:3px}
.check{display:flex;align-items:center;gap:8px;font-size:13.5px;color:var(--tx);cursor:pointer;font-weight:500}
.fgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.fgrid .full{grid-column:1/-1}
@media (max-width:640px){.fgrid{grid-template-columns:1fr}}

.badge{display:inline-flex;align-items:center;gap:4px;height:22px;padding:0 8px;border-radius:99px;font-size:11px;font-weight:700;background:var(--panel2);color:var(--tx2);border:1px solid var(--line);white-space:nowrap}
.b-ok{background:var(--ok-soft);color:var(--ok);border-color:transparent}.b-warn{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.b-bad{background:var(--bad-soft);color:var(--bad);border-color:transparent}.b-ac{background:var(--ac-soft);color:var(--ac);border-color:transparent}
.b-info{background:rgba(6,182,212,.14);color:var(--info);border-color:transparent}
.chip{display:inline-flex;align-items:center;gap:6px;padding:6px 11px;border-radius:99px;border:1px solid var(--line2);background:var(--panel2);font-size:12.5px;font-weight:600;cursor:pointer;color:var(--tx2);user-select:none}
.chip.on{background:var(--ac-soft);border-color:var(--ac);color:var(--tx)}

.kpi{display:flex;flex-direction:column;gap:4px}
.kpi .v{font-size:26px;font-weight:800;letter-spacing:-.02em}.kpi .l{font-size:12px;color:var(--tx2);font-weight:600}
.kpi .ic{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:var(--ac-soft);color:var(--ac);margin-bottom:6px}

.bar{height:8px;border-radius:99px;background:var(--panel2);overflow:hidden;border:1px solid var(--line)}
.bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--ac),var(--ac2));border-radius:99px;transition:width .4s}
.bar.ok>i{background:var(--ok)}.bar.warn>i{background:var(--warn)}.bar.bad>i{background:var(--bad)}

/* tabel responsif: menjadi kartu di layar kecil */
.tbl{width:100%;border-collapse:collapse}
.tbl th{text-align:left;font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--tx3);font-weight:700;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:11px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}.tbl tbody tr:hover{background:var(--panel2)}
.tbl-wrap{overflow-x:auto}
@media (max-width:760px){
  .tbl.resp thead{display:none}
  .tbl.resp,.tbl.resp tbody,.tbl.resp tr,.tbl.resp td{display:block;width:100%}
  .tbl.resp tr{border:1px solid var(--line);border-radius:12px;margin-bottom:10px;padding:6px 4px;background:var(--panel)}
  .tbl.resp td{border:0;padding:6px 10px;display:flex;gap:10px;justify-content:space-between;align-items:center;text-align:right}
  .tbl.resp td::before{content:attr(data-l);font-size:11px;color:var(--tx3);font-weight:700;text-transform:uppercase;text-align:left;flex:none}
  .tbl.resp td.tl{display:block;text-align:left}.tbl.resp td.tl::before{display:block;margin-bottom:2px}
}

.list{display:flex;flex-direction:column}
.li{display:flex;gap:12px;align-items:center;padding:11px 4px;border-bottom:1px solid var(--line)}
.li:last-child{border-bottom:0}
.thumb{width:72px;height:44px;border-radius:8px;background:var(--panel2) center/cover;flex:none;display:grid;place-items:center;color:var(--tx3);border:1px solid var(--line)}
.empty{padding:40px 16px;text-align:center;color:var(--tx2)}
.empty .ic{width:52px;height:52px;border-radius:16px;margin:0 auto 12px;display:grid;place-items:center;background:var(--ac-soft);color:var(--ac)}

.tabs{display:flex;gap:4px;padding:4px;background:var(--panel2);border:1px solid var(--line);border-radius:12px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{border:0;background:transparent;color:var(--tx2);padding:7px 12px;border-radius:9px;font-weight:600;cursor:pointer;white-space:nowrap}
.tabs button.on{background:var(--panel);color:var(--tx);box-shadow:0 1px 3px rgba(0,0,0,.2)}

.ph{display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.ph .grow p{margin:4px 0 0;color:var(--tx2)}

/* skor */
.score{--v:0;--c:var(--ac);width:52px;height:52px;border-radius:50%;display:grid;place-items:center;flex:none;background:conic-gradient(var(--c) calc(var(--v)*1%),var(--panel2) 0);position:relative}
.score::after{content:"";position:absolute;inset:5px;border-radius:50%;background:var(--panel)}
.score b{position:relative;z-index:1;font-size:15px}
.t-EXCEPTIONAL{--c:#22c55e}.t-EXCELLENT{--c:#84cc16}.t-GOOD{--c:#6366f1}.t-REVIEW{--c:#f59e0b}.t-LOW_POTENTIAL{--c:#ef4444}
.mini-bars{display:grid;grid-template-columns:auto 1fr auto;gap:4px 8px;align-items:center;font-size:11.5px;color:var(--tx2)}
.mini-bars .bar{height:6px}

/* modal / sheet */
.modal-bg{position:fixed;inset:0;z-index:80;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;padding:20px;animation:fi .15s}
.modal{background:var(--panel);border:1px solid var(--line);border-radius:18px;width:min(640px,100%);max-height:calc(100dvh - 40px);display:flex;flex-direction:column;box-shadow:var(--sh);animation:up .2s ease}
.modal.wide{width:min(980px,100%)}
.modal-h{display:flex;align-items:center;gap:10px;padding:16px 18px;border-bottom:1px solid var(--line)}.modal-h h3{flex:1}
.modal-b{padding:18px;overflow-y:auto}
.modal-f{display:flex;gap:8px;justify-content:flex-end;padding:12px 18px;border-top:1px solid var(--line);flex-wrap:wrap}
@keyframes fi{from{opacity:0}}@keyframes up{from{transform:translateY(16px);opacity:0}}
@media (max-width:640px){
  .modal-bg{align-items:flex-end;padding:0}
  .modal,.modal.wide{width:100%;border-radius:20px 20px 0 0;max-height:92dvh;padding-bottom:var(--sab)}
  .modal-h::before{content:"";position:absolute;left:50%;transform:translateX(-50%);margin-top:-26px;width:40px;height:4px;border-radius:4px;background:var(--line2)}
  .modal-h{position:relative;padding-top:20px}
  .modal-f .btn{flex:1}
}

.toasts{position:fixed;z-index:120;right:16px;bottom:16px;display:flex;flex-direction:column;gap:8px;max-width:min(380px,calc(100vw - 32px))}
@media (max-width:1023px){.toasts{left:12px;right:12px;bottom:calc(var(--bnav) + 12px + var(--sab));max-width:none}}
.toast{background:var(--panel);border:1px solid var(--line2);border-left:4px solid var(--ac);border-radius:12px;padding:11px 14px;box-shadow:var(--sh);display:flex;gap:10px;align-items:flex-start;animation:up .2s}
.toast.ok{border-left-color:var(--ok)}.toast.bad{border-left-color:var(--bad)}.toast.warn{border-left-color:var(--warn)}

.banner{display:flex;gap:10px;align-items:center;padding:11px 14px;border-radius:12px;border:1px solid var(--line);background:var(--panel2);margin-bottom:14px;font-size:13px;flex-wrap:wrap}
.banner.warn{background:var(--warn-soft);border-color:transparent}.banner.ac{background:var(--ac-soft);border-color:transparent}.banner.bad{background:var(--bad-soft);border-color:transparent}

.net{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:700;padding:4px 9px;border-radius:99px;background:var(--warn-soft);color:var(--warn)}
.ws-sel{max-width:200px;min-height:34px;padding:5px 10px;font-size:13px}
.avatar{width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg,var(--ac),var(--ac2));display:grid;place-items:center;color:#fff;font-weight:700;font-size:12px;flex:none}
.dot-unread{position:absolute;top:6px;right:6px;width:8px;height:8px;border-radius:50%;background:var(--bad);border:2px solid var(--bg)}

/* auth */
.auth{min-height:100vh;min-height:100dvh;display:grid;place-items:center;padding:20px;background:radial-gradient(1000px 500px at 10% -10%,rgba(99,102,241,.25),transparent),radial-gradient(800px 500px at 110% 110%,rgba(168,85,247,.2),transparent),var(--bg)}
.auth-card{width:min(420px,100%);background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:28px;box-shadow:var(--sh)}

/* transcript */
.seg{display:grid;grid-template-columns:62px 1fr;gap:10px;padding:8px 10px;border-radius:10px;cursor:default}
.seg:hover{background:var(--panel2)}.seg.sel{background:var(--ac-soft)}.seg.play{outline:1px solid var(--ac)}
.seg .ts{font-family:ui-monospace,monospace;font-size:11.5px;color:var(--ac);cursor:pointer;padding-top:2px}
.seg .sp{font-size:11px;font-weight:700;margin-bottom:2px}
.seg .tx{outline:none;border-radius:6px;padding:1px 3px;margin:-1px -3px}
.seg .tx:focus{background:var(--bg2);box-shadow:0 0 0 2px var(--ac-soft)}
mark{background:rgba(250,204,21,.35);color:inherit;border-radius:3px;padding:0 1px}

/* studio */
.studio{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:14px;align-items:start}
@media (max-width:1100px){.studio{grid-template-columns:1fr}}
.stage{background:#000 repeating-conic-gradient(#111 0 25%,#0b0b0b 0 50%) 50%/24px 24px;border-radius:var(--r);border:1px solid var(--line);display:grid;place-items:center;padding:12px;min-height:300px}
.stage canvas{width:100%;height:min(66vh,760px);object-fit:contain;display:block}
.timeline{position:relative;height:42px;border-radius:10px;background:var(--panel2);border:1px solid var(--line);overflow:hidden;cursor:pointer;touch-action:none}
.timeline .sel{position:absolute;top:0;bottom:0;background:var(--ac-soft);border-left:2px solid var(--ac);border-right:2px solid var(--ac)}
.timeline .ph{position:absolute;top:0;bottom:0;width:2px;background:#fff;margin:0}
.timeline .cm{position:absolute;top:2px;width:8px;height:8px;border-radius:50%;background:var(--warn);transform:translateX(-4px)}

/* calendar */
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.cal .dh{font-size:11px;font-weight:700;color:var(--tx3);text-align:center;padding:4px 0}
.cal .d{min-height:96px;border:1px solid var(--line);border-radius:10px;padding:6px;background:var(--panel);display:flex;flex-direction:column;gap:3px;min-width:0}
.cal .d.out{opacity:.4}.cal .d.today{border-color:var(--ac)}
.cal .d .n{font-size:11.5px;font-weight:700;color:var(--tx2)}
.cal .ev{font-size:10.5px;padding:2px 5px;border-radius:5px;background:var(--ac-soft);color:var(--tx);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer}
.cal .ev.PUBLISHED{background:var(--ok-soft)}.cal .ev.FAILED{background:var(--bad-soft)}.cal .ev.CANCELLED{opacity:.5;text-decoration:line-through}
@media (max-width:760px){.cal .d{min-height:54px;padding:4px}.cal .ev{font-size:0;height:6px;padding:0;background:var(--ac)}.cal .ev.PUBLISHED{background:var(--ok)}.cal .ev.FAILED{background:var(--bad)}.cal .d .n{font-size:11px}}

.heat{display:grid;grid-template-columns:34px repeat(24,minmax(0,1fr));gap:2px;font-size:9.5px;color:var(--tx3)}
.heat i{aspect-ratio:1;border-radius:3px;background:var(--panel2)}
.md{line-height:1.65}.md h1,.md h2,.md h3{margin:16px 0 8px}.md p{margin:8px 0}.md ul,.md ol{padding-left:22px}.md blockquote{margin:8px 0;padding:6px 12px;border-left:3px solid var(--ac);background:var(--panel2);border-radius:6px}
.md code{background:var(--panel2);padding:1px 5px;border-radius:5px}
.skel{background:linear-gradient(90deg,var(--panel2),var(--line),var(--panel2));background-size:200% 100%;animation:sk 1.2s infinite;border-radius:10px;min-height:16px}
@keyframes sk{to{background-position:-200% 0}}
.drop{border:2px dashed var(--line2);border-radius:14px;padding:26px;text-align:center;color:var(--tx2);cursor:pointer;transition:.15s}
.drop.on,.drop:hover{border-color:var(--ac);background:var(--ac-soft);color:var(--tx)}
.steps{display:flex;gap:6px;flex-wrap:wrap}
.step{flex:1;min-width:120px;padding:10px;border-radius:12px;border:1px solid var(--line);background:var(--panel2)}
.step.APPROVED{border-color:var(--ok);background:var(--ok-soft)}.step.REJECTED,.step.REVISION_REQUESTED{border-color:var(--bad);background:var(--bad-soft)}.step.cur{border-color:var(--ac)}
svg.i{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
svg.i.s{width:15px;height:15px}svg.i.l{width:22px;height:22px}
.chart svg{width:100%;height:auto;display:block}
.chart text{fill:var(--tx3);font-size:10px}
@media (max-width:640px){
  .ph{flex-direction:column;align-items:stretch;gap:10px}
  .ph h1{font-size:20px}
  .ph>.row{width:100%}
  .ph>.row>.btn,.ph>.row>select{flex:1 1 auto}
  .g6 .card.kpi{padding:12px}
  .kpi .v{font-size:21px}.kpi .ic{width:28px;height:28px;margin-bottom:2px}
  .card{padding:14px}
}
@media (max-width:520px){.g6{grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}.g6 .kpi .l{font-size:11px}.g6 .kpi .xs{display:none}}
/* foto profil & zoom */
.avatar.img{padding:0;overflow:hidden;background:var(--panel2)}
.avatar.img img{width:100%;height:100%;object-fit:cover;display:block}
.avatar.zoomable{cursor:zoom-in;outline-offset:2px}.avatar.zoomable:hover,.avatar.zoomable:focus-visible{outline:2px solid var(--ac)}
.zoom-bg{position:fixed;inset:0;z-index:150;background:#050507;display:flex;flex-direction:column;animation:fi .15s;color:#fff}
.zoom-top{display:flex;align-items:center;gap:6px;padding:calc(10px + var(--sat)) 12px 10px}
.zoom-top .btn{color:#fff;font-size:18px}.zoom-top .btn:hover{background:rgba(255,255,255,.12)}
.zoom-stage{flex:1;display:grid;place-items:center;overflow:hidden;touch-action:none;position:relative;cursor:zoom-in}
.zoom-stage img{max-width:min(92vw,900px);max-height:78vh;border-radius:12px;user-select:none;-webkit-user-drag:none;will-change:transform;box-shadow:0 20px 60px rgba(0,0,0,.6)}
.zoom-hint{text-align:center;color:#a1a1aa;padding:8px 12px calc(12px + var(--sab))}
.crop-wrap{position:relative;width:min(320px,80vw);aspect-ratio:1;margin:0 auto 12px;touch-action:none}
.crop-wrap canvas{width:100%;height:100%;border-radius:14px;cursor:grab;display:block;background:#000}
.crop-ring{position:absolute;inset:0;border-radius:50%;box-shadow:0 0 0 999px rgba(0,0,0,.45);pointer-events:none;border:2px solid rgba(255,255,255,.85)}
.crop-wrap{overflow:hidden;border-radius:14px}
/* dokumen legal */
.legal-page{max-width:900px;margin:0 auto;padding:24px}

// ================= Penyimpanan offline (IndexedDB) =================
var Store = (function () {

        var r = indexedDB.open('cuplikin', 1);
        r.onupgradeneeded = function () { r.result.createObjectStore('kv'); r.result.createObjectStore('outbox', { keyPath: 'reqId' }); };

    });
    return dbp;
  }
  function tx(store, mode, fn) {
    return open().then(function (db) {
      if (!db) return fn(null);
      return new Promise(function (res, rej) {

    get: function (k) { return tx('kv', 'readonly', function (s) { return s ? s.get(k) : { result: mem.kv[k] }; }).then(function (v) { return v && v.result !== undefined ? v.result : v; }); },
    set: function (k, v) { return tx('kv', 'readwrite', function (s) { if (s) s.put(v, k); else mem.kv[k] = v; }); },
    clear: function () { return tx('kv', 'readwrite', function (s) { if (s) s.clear(); else mem.kv = {}; }); },
    queue: function (item) { return tx('outbox', 'readwrite', function (s) { if (s) s.put(item); else mem.outbox[item.reqId] = item; }); },
    pending: function () {

      });

  };

function cacheKey(action, payload) { return action + ':' + (S.wsId || '') + ':' + JSON.stringify(payload || {}); }

/** call(action, payload, {silent, noQueue}) → Promise<data> */
function call(action, payload, opt) {

  return rawCall(req).then(function (res) {
    setOnline(true);
    if (!res.ok) {
      var e = new Error(res.error.message); e.code = res.error.code; e.status = res.error.status;

      if (e.code === 'LEGAL_REQUIRED') renderLegalGate();

function setOnline(v) {

    items.sort(function (a, b) { return a.at - b.at; });
    var okN = 0;
    return items.reduce(function (p, it) {

}

  $('#app').innerHTML = authFrame(

    e.preventDefault(); saveApiUrl();

/** Ambil durasi, resolusi & thumbnail dari file lokal. */

  });
}

/** ID video YouTube dari tautan (watch, youtu.be, shorts, live, embed); '' bila bukan YouTube. */
function ytId(url) {
  var m = String(url || '').trim().match(/^https?:\/\/(?:www\.|m\.|music\.)?(?:youtube\.com\/(?:watch\?(?:[^#]*&)?v=|shorts\/|live\/|embed\/|v\/)|youtu\.be\/)([A-Za-z0-9_-]{11})(?![A-Za-z0-9_-])/i);
  return m ? m[1] : '';
}
/** "754" | "12:34" | "1:02:30" → detik; '' → 0; tidak valid → null. */
function parseDur(v) {
  v = String(v == null ? '' : v).trim().replace(',', '.');
  if (!v) return 0;
  if (/^\d+(\.\d+)?$/.test(v)) return Number(v);
  if (!/^\d{1,3}(:\d{1,2}){1,2}(\.\d+)?$/.test(v)) return null;
  return v.split(':').reduce(function (a, x) { return a * 60 + Number(x); }, 0);
}
function fmtDurIn(sec) { sec = Math.round(sec); var h = Math.floor(sec / 3600), m = Math.floor(sec % 3600 / 60), s = sec % 60; return (h ? h + ':' + (m < 10 ? '0' : '') : '') + m + ':' + (s < 10 ? '0' : '') + s; }
function guessMime(name) {
  var ext = (name.split('.').pop() || '').toLowerCase();
  return { mp4: 'video/mp4', mov: 'video/quicktime', mkv: 'video/x-matroska', webm: 'video/webm', mp3: 'audio/mpeg', wav: 'audio/wav', m4a: 'audio/x-m4a', aac: 'audio/aac', ogg: 'audio/ogg' }[ext] || 'application/octet-stream';
}

// ================= Transkrip =================
function toSrt(segs, vtt, speakers) {
  var spk = {}; (speakers || []).forEach(function (s) { spk[s.id] = s.name; });
  var tc = function (x) { var h = Math.floor(x / 3600), m = Math.floor(x % 3600 / 60), s = Math.floor(x % 60), ms = Math.round((x % 1) * 1000); return String(h).padStart(2, '0') + ':' + String(m).padStart(2, '0') + ':' + String(s).padStart(2, '0') + (vtt ? '.' : ',') + String(ms).padStart(3, '0'); };
  return (vtt ? 'WEBVTT\n\n' : '') + segs.map(function (s, i) { return (vtt ? '' : (i + 1) + '\n') + tc(s.s) + ' --> ' + tc(s.e) + '\n' + (vtt && spk[s.sp] ? '<v ' + spk[s.sp] + '>' : '') + s.t; }).join('\n\n') + '\n';
}

var ASPECTS = { '9:16': [720, 1280], '4:5': [864, 1080], '1:1': [1080, 1080], '16:9': [1280, 720] };
var Renderer = {
  imgCache: {},
  img: function (src) {
    if (!src) return null;
    if (Renderer.imgCache[src]) return Renderer.imgCache[src];
    var im = new Image(); im.src = src; Renderer.imgCache[src] = im; return im;
  },
  wrap: function (ctx, words, maxW) {
    var lines = [[]], w = 0, sp = ctx.measureText(' ').width;
    words.forEach(function (wd, i) {
      var ww = ctx.measureText(wd.t).width;
      if (w + ww > maxW && lines[lines.length - 1].length) { lines.push([]); w = 0; }
      lines[lines.length - 1].push({ t: wd.t, i: wd.i, w: ww }); w += ww + sp;
    });
    return lines;
  },
  /** Gambar 1 frame. o = {video, W, H, t (detik absolut), clip, segs, brand, edit, forceWatermark, title} */
  draw: function (ctx, o) {
    var W = o.W, H = o.H, v = o.video, e = o.edit || {}, br = o.brand || {};
    ctx.save(); ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H);
    if (v && v.videoWidth) {
      var vw = v.videoWidth, vh = v.videoHeight, zoom = Number(e.zoom || 1);
      var fit = e.fit || 'cover';
      if (fit === 'cover') {
        var scale = Math.max(W / vw, H / vh) * zoom, sw = W / scale, sh = H / scale;
        var fx = Number(e.focusX === undefined ? 0.5 : e.focusX);
        var sx = Math.max(0, Math.min(vw - sw, fx * vw - sw / 2)), sy = Math.max(0, (vh - sh) / 2);
        ctx.drawImage(v, sx, sy, sw, sh, 0, 0, W, H);
      } else {
        var cs = Math.max(W / vw, H / vh) * 1.1;
        ctx.filter = 'blur(28px) brightness(0.55)';
        ctx.drawImage(v, (W - vw * cs) / 2, (H - vh * cs) / 2, vw * cs, vh * cs);
        ctx.filter = 'none';
        var s2 = Math.min(W / vw, H / vh) * zoom;
        ctx.drawImage(v, (W - vw * s2) / 2, (H - vh * s2) / 2, vw * s2, vh * s2);
      }
    } else {
      var g = ctx.createLinearGradient(0, 0, W, H); g.addColorStop(0, br.primary || '#312e81'); g.addColorStop(1, br.secondary || '#581c87');
      ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
      if (o.audioOnly) { ctx.fillStyle = 'rgba(255,255,255,.15)'; for (var b = 0; b < 40; b++) { var hh = (Math.sin((o.t || 0) * 6 + b) * .5 + .5) * H * .18 + 8; ctx.fillRect(W * .1 + b * W * .8 / 40, H * .45 - hh / 2, W * .8 / 40 - 4, hh); } }
    }
    var base = Math.min(W, H);
    // judul pembuka
    if (e.titleCard !== false && o.title && o.t - o.clip.start < 2.6) {
      var a = Math.min(1, (2.6 - (o.t - o.clip.start)) / 0.4);
      ctx.globalAlpha = a; ctx.font = '800 ' + Math.round(base * 0.055) + 'px ' + (br.font || 'Inter') + ', sans-serif';
      var lines = Renderer.wrap(ctx, o.title.split(' ').map(function (t, i) { return { t: t, i: i }; }), W * 0.8);
      var lh = base * 0.07, bh = lines.length * lh + base * 0.05, y0 = H * 0.12;
      ctx.fillStyle = br.primary || '#6366f1'; Renderer.round(ctx, W * 0.07, y0, W * 0.86, bh, base * 0.03); ctx.fill();
      ctx.fillStyle = br.textColor || '#fff'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      lines.forEach(function (ln, i) { ctx.fillText(ln.map(function (x) { return x.t; }).join(' '), W / 2, y0 + base * 0.025 + lh * (i + 0.5)); });
      ctx.globalAlpha = 1;
    }
    // subtitle kinetik
    var seg = null;
    for (var k = 0; k < (o.segs || []).length; k++) if (o.segs[k].s <= o.t && o.segs[k].e > o.t) { seg = o.segs[k]; break; }
    if (seg) Renderer.caption(ctx, o, seg, base);
    // logo & watermark
    var pos = br.logoPos || 'TOP_RIGHT', m = base * 0.04;
    if (e.showLogo !== false && br.logo) {
      var im = Renderer.img(br.logo);
      if (im && im.complete && im.naturalWidth) {
        var lw = base * 0.16, lh2 = lw * im.naturalHeight / im.naturalWidth;
        ctx.globalAlpha = 0.95; ctx.drawImage(im, /LEFT/.test(pos) ? m : W - m - lw, /TOP/.test(pos) ? m : H - m - lh2 - base * 0.03, lw, lh2); ctx.globalAlpha = 1;
      }
    }
    var wm = o.forceWatermark ? 'Dibuat dengan Cuplikin' : (e.showWatermark !== false ? br.watermarkText : '');
    if (wm) {
      ctx.globalAlpha = o.forceWatermark ? 0.85 : Number(br.watermarkOpacity || 0.7);
      ctx.font = '700 ' + Math.round(base * 0.028) + 'px Inter, sans-serif'; ctx.fillStyle = '#fff'; ctx.shadowColor = 'rgba(0,0,0,.6)'; ctx.shadowBlur = 6;
      ctx.textAlign = /LEFT/.test(pos) ? 'right' : 'left'; ctx.textBaseline = 'alphabetic';
      ctx.fillText(wm, /LEFT/.test(pos) ? W - m : m, /TOP/.test(pos) ? m + base * 0.03 : H - m);
      ctx.shadowBlur = 0; ctx.globalAlpha = 1;
    }
    if (e.progressBar !== false && o.clip) {
      var pr = Math.max(0, Math.min(1, (o.t - o.clip.start) / Math.max(0.1, o.clip.end - o.clip.start)));
      ctx.fillStyle = 'rgba(255,255,255,.18)'; ctx.fillRect(0, H - base * 0.012, W, base * 0.012);
      ctx.fillStyle = br.accent || '#facc15'; ctx.fillRect(0, H - base * 0.012, W * pr, base * 0.012);
    }
    ctx.restore();
  },
  round: function (ctx, x, y, w, h, r) { ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath(); },
  caption: function (ctx, o, seg, base) {
    var W = o.W, H = o.H, br = o.brand || {}, e = o.edit || {};
    var style = e.style || br.captionStyle || 'BOLD_KINETIC';
    var words = seg.t.split(/\s+/).filter(Boolean);
    var prog = (o.t - seg.s) / Math.max(0.2, seg.e - seg.s);
    var cur = Math.min(words.length - 1, Math.floor(prog * words.length));
    var chunk = style === 'CLEAN_MINIMAL' ? 12 : 6;
    var startW = Math.floor(cur / chunk) * chunk;
    var shown = words.slice(startW, startW + chunk).map(function (t, i) { return { t: style === 'CLEAN_MINIMAL' ? t : t.toUpperCase(), i: startW + i }; });
    var size = Math.round(base * (style === 'CLEAN_MINIMAL' ? 0.045 : 0.068) * Number(e.subSize || 1));
    ctx.font = (style === 'CLEAN_MINIMAL' ? '600 ' : '900 ') + size + 'px ' + (br.font || 'Inter') + ', Impact, sans-serif';
    ctx.textBaseline = 'middle'; ctx.textAlign = 'left'; ctx.lineJoin = 'round';
    var lines = Renderer.wrap(ctx, shown, W * 0.86);
    var lh = size * 1.22, total = lines.length * lh;
    var pos = e.subPos || br.captionPos || 'BOTTOM';
    var cy = pos === 'TOP' ? H * 0.22 : pos === 'MIDDLE' ? H * 0.5 : H * 0.74;
    var acc = br.accent || '#facc15', txt = br.textColor || '#ffffff';
    var spw = ctx.measureText(' ').width;
    lines.forEach(function (ln, li) {
      var lw = ln.reduce(function (a, w) { return a + w.w; }, 0) + spw * (ln.length - 1);
      var x = (W - lw) / 2, y = cy - total / 2 + lh * (li + 0.5);
      if (style === 'BOXED_OUTLINE') { ctx.fillStyle = 'rgba(0,0,0,.72)'; Renderer.round(ctx, x - size * 0.35, y - lh / 2, lw + size * 0.7, lh, size * 0.25); ctx.fill(); }
      ln.forEach(function (w) {
        var active = w.i === cur, spoken = w.i <= cur;
        var color = txt;
        if (style === 'BOLD_KINETIC' || style === 'IMPACT_POP') color = active ? acc : txt;
        if (style === 'KARAOKE_POP') color = spoken ? acc : txt;
        if (style === 'NEON_GLOW') { ctx.shadowColor = br.primary || '#6366f1'; ctx.shadowBlur = size * 0.6; color = active ? acc : txt; }
        var sc = (style === 'IMPACT_POP' && active) ? 1.14 : 1;
        ctx.save(); ctx.translate(x + w.w / 2, y); ctx.scale(sc, sc);
        if (style !== 'BOXED_OUTLINE' && style !== 'CLEAN_MINIMAL') { ctx.lineWidth = size * 0.16; ctx.strokeStyle = 'rgba(0,0,0,.92)'; ctx.strokeText(w.t, -w.w / 2, 0); }
        if (style === 'CLEAN_MINIMAL') { ctx.shadowColor = 'rgba(0,0,0,.8)'; ctx.shadowBlur = size * 0.3; }
        ctx.fillStyle = color; ctx.fillText(w.t, -w.w / 2, 0);
        ctx.restore(); ctx.shadowBlur = 0;
        x += w.w + spw;
      });
    });
  }
};

      };
      tick();
    });
  }
};

        if (f.custom.value.trim() && !/^gemini-[a-z0-9.\-]{2,60}$/.test(model)) return toast('Nama model harus diawali "gemini-"', 'warn');
        call('settings.save', { secrets: { GEMINI_API_KEY: f.GEMINI_API_KEY.value }, model: model, modelMedia: f.modelMedia.value }).then(function (r) { S.boot.aiConfigured = r.aiConfigured; s = r; toast('Tersimpan · ' + r.model + ' / ' + r.modelMedia, 'ok'); render2(extra); }).catch(errToast);
      };
      act($('#tai'), function () {
        return call('settings.testAi').then(function (r) {
          $('#taiOut').innerHTML = '<div class="col gap6 mt12">' + r.results.map(function (x) { return '<div class="banner ' + (x.ok ? '' : 'bad') + ' small" style="margin:0">' + ic(x.ok ? 'checkc' : 'x') + '<div class="grow"><b>' + (x.kind === 'media' ? 'Media' : 'Teks') + '</b> · <span class="mono">' + esc(x.model) + '</span> · ' + x.ms + ' ms' + (x.error ? '<div>' + esc(x.error) + '</div>' : '') + '</div></div>'; }).join('') + '</div>';
        });
      });
      act($('#lmd'), function () { return call('settings.listModels').then(function (list) { toast(list.length + ' model tersedia untuk API key ini', 'ok'); render2(list); var nw = list.filter(function (m) { return !m.known; }); if (nw.length) toast('Model baru di luar katalog: ' + nw.map(function (m) { return m.id; }).join(', '), '', 8000); }); });
      $('#nf').onsubmit = function (e) { e.preventDefault(); var g = this; call('settings.save', { secrets: { FONNTE_TOKEN: g.FONNTE_TOKEN.value, TELEGRAM_BOT_TOKEN: g.TELEGRAM_BOT_TOKEN.value, WEBHOOK_SECRET: g.WEBHOOK_SECRET.value } }).then(function () { toast('Tersimpan', 'ok'); }).catch(errToast); };
    };
    render2();
  },
  app: function (box) {
    var url = ls('cf_api_url') || (CF_API_URL.indexOf('__API') === 0 ? '' : CF_API_URL);
    box.innerHTML = '<div class="grid g2"><div class="card"><div class="card-h"><h3>Mode aplikasi</h3><span class="badge b-ac">' + (IS_GAS ? 'Apps Script' : 'PWA (GitHub Pages)') + '</span></div>' +
      (IS_GAS ? '<p class="small muted" style="margin-top:0">Anda membuka aplikasi langsung dari Apps Script. Untuk mode <b>offline & instal ke layar utama</b>, gunakan versi PWA (GitHub Pages) dengan URL Web App di bawah ini.</p>' :
        '<label class="f">URL API (Web App /exec)<input class="inp mono" id="au" value="' + esc(url) + '"></label><button class="btn mt8" id="aus">Simpan & muat ulang</button>') +
      '<div class="small muted mt12">Status jaringan: <b>' + (Net.online ? 'Online' : 'Offline') + '</b> · Perubahan tertunda: <b>' + Net.pending + '</b></div><div class="row wrap mt8"><button class="btn sm" id="sy">' + ic('refresh', 's') + ' Sinkronkan</button><button class="btn sm" id="cc">Bersihkan cache offline</button></div></div>' +
      '<div class="card"><div class="card-h"><h3>Instal aplikasi</h3></div><p class="small muted" style="margin-top:0">Di Android/Chrome: menu ⋮ → <b>Instal aplikasi</b>. Di iPhone/Safari: Bagikan → <b>Tambah ke Layar Utama</b>.</p><button class="btn pri hide" id="inst">' + ic('download') + ' Instal sekarang</button></div></div>';
    if ($('#aus')) $('#aus').onclick = function () { ls('cf_api_url', $('#au').value.trim()); location.reload(); };
    act($('#sy'), function () { return syncOutbox(); });
    act($('#cc'), function () { return Store.clear().then(function () { toast('Cache dibersihkan', 'ok'); }); });
    if (window._installEvt) { $('#inst').classList.remove('hide'); $('#inst').onclick = function () { window._installEvt.prompt(); }; }
  }
};

// ================= Kesehatan Sistem =================

  render: function (el) {
    return call('system.health').then(function (h) {
      el.innerHTML = pageHead('Kesehatan Sistem', 'Versi ' + esc(h.version) + ' · Script ID <span class="mono">' + esc(h.scriptId) + '</span>',
        '<button class="btn" id="tr">' + ic('clock') + ' Pasang ulang trigger</button><button class="btn" id="cl">' + ic('trash') + ' Bersihkan</button><button class="btn" id="ca">' + ic('search') + ' Audit sel</button><button class="btn pri" id="bk">' + ic('download') + ' Backup sekarang</button>') +
        '<div class="grid g4"><div class="card kpi"><div class="ic">' + ic('layers') + '</div><div class="v">' + h.cellPct + '%</div><div class="l">Kapasitas sel spreadsheet</div><div class="xs dim">' + fmtNum(h.totalCells) + ' / 10 jt sel</div></div>' +
        '<div class="card kpi"><div class="ic">' + ic('text') + '</div><div class="v">' + h.blobs.refs + '</div><div class="l">Nilai > ' + fmtNum(h.blobs.chunkSize) + ' karakter</div><div class="xs dim">dipecah jadi ' + h.blobs.parts + ' bagian (_Blobs)</div></div>' +
        '<div class="card kpi"><div class="ic">' + ic('clock') + '</div><div class="v">' + h.triggers.length + '</div><div class="l">Trigger aktif</div><div class="xs dim">Cron terakhir: ' + (h.lastCron ? ago(h.lastCron) : 'belum') + '</div></div>' +
        '<div class="card kpi"><div class="ic">' + ic('send') + '</div><div class="v">' + h.mailQuota + '</div><div class="l">Sisa kuota email hari ini</div><div class="xs dim">Backup terakhir: ' + (h.lastBackup ? ago(h.lastBackup) : 'belum') + '</div></div></div>' +
        '<div class="banner mt16 small">' + ic('info') + '<div class="grow">Batas Google Sheets: <b>50.000 karakter per sel</b>. Aplikasi otomatis memecah nilai panjang (transkrip, subtitle, artikel, logo) menjadi potongan ' + fmtNum(h.blobs.chunkSize) + ' karakter di sheet <span class="mono">_Blobs</span> dan menyatukannya kembali saat dibaca.</div></div>' +
        '<div class="grid g2 mt16"><div class="card pad0"><table class="tbl resp"><thead><tr><th>Sheet</th><th>Baris</th><th>Kolom</th><th>Sel</th></tr></thead><tbody>' + h.sheets.map(function (s) { return '<tr><td data-l="Sheet" class="mono">' + esc(s.name) + '</td><td data-l="Baris">' + fmtNum(s.rows) + '</td><td data-l="Kolom">' + s.cols + '</td><td data-l="Sel">' + fmtNum(s.cells) + '</td></tr>'; }).join('') + '</tbody></table></div>' +
        '<div class="col"><div class="card"><div class="card-h"><h3>Sumber daya</h3></div><div class="col small"><a target="_blank" rel="noopener" href="' + esc(h.spreadsheetUrl) + '">' + ic('ext', 's') + ' Buka spreadsheet database</a>' + (h.driveFolder ? '<a target="_blank" rel="noopener" href="' + esc(h.driveFolder) + '">' + ic('ext', 's') + ' Buka folder Drive</a>' : '') +
        '<div>AI: ' + (h.aiConfigured ? '<span class="badge b-ok">' + esc(h.model) + '</span>' : '<span class="badge b-warn">belum diatur</span>') + '</div><div>Trigger: ' + h.triggers.map(function (t) { return '<span class="badge">' + esc(t.fn) + '</span>'; }).join(' ') + '</div></div></div><div class="card hide" id="out"></div></div></div>';
      var show = function (title, obj) { var o = $('#out'); o.classList.remove('hide'); o.innerHTML = '<div class="card-h"><h3>' + title + '</h3></div><pre class="mono" style="white-space:pre-wrap;margin:0">' + esc(JSON.stringify(obj, null, 2)) + '</pre>'; };
      act($('#tr'), function () { return call('system.triggers').then(function (r) { show('Trigger', r); }); });
      act($('#cl'), function () { return call('system.cleanup').then(function (r) { show('Pembersihan', r); }); });
      act($('#ca'), function () { return call('system.cellAudit').then(function (r) { show('Audit sel (maks ' + r.limit + ')', r.sheets); }); });
      act($('#bk'), function () { return call('system.backup').then(function (r) { show('Backup', r); toast('Backup dibuat', 'ok'); }); });
    });
  }
};

<script>
if (!IS_GAS && "serviceWorker" in navigator) {
  window.addEventListener("load", function () {
    navigator.serviceWorker.register("sw.js").then(function (reg) {
      reg.addEventListener("updatefound", function () {
        var nw = reg.installing; nw && nw.addEventListener("statechange", function () {
          if (nw.state === "installed" && navigator.serviceWorker.controller) toast("Versi baru tersedia — muat ulang untuk memperbarui.", "ok", 8000);
        });
      });
    }).catch(function () {});
  });
}
window.addEventListener("beforeinstallprompt", function (e) { e.preventDefault(); window._installEvt = e; });
</script>
